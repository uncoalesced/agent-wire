name: security

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays: new advisories land against an unchanged lockfile
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Known CVEs in every locked dependency, including the optional extras.
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Export the lockfile
        run: uv export --frozen --no-hashes --all-extras --no-emit-project -o requirements-audit.txt
      - name: pip-audit
        run: uvx pip-audit==2.10.1 -r requirements-audit.txt --progress-spinner off --desc

  # Python security lint: medium severity and up fails the job.
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: bandit
        run: uvx bandit==1.9.4 -r src -ll

  # The workflows themselves: unpinned actions, credential leaks, template injection.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: zizmor
        run: uvx zizmor==1.31.1 --format plain .github/workflows
        env:
          GH_TOKEN: ${{ github.token }}

  # Dependencies a pull request adds or upgrades, checked against GitHub's advisory database.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
