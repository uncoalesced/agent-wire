[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-wire"
version = "0.2.0"
description = "High-speed, privacy-first, token-compressed live web and multi-platform intelligence engine for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "cryptography>=50.0.2",
    "curl-cffi>=0.16.3",
    "fastmcp>=4.1.0",
    "orjson>=3.13.0",
    "pydantic>=2.14.1",
    "rookiepy>=0.5.6 ; python_full_version < '3.14'",
    "selectolax>=1.0.0",
    "tiktoken>=0.14.0",
    "trafilatura>=2.3.1",
    "typer>=0.27.3",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
stealth = [
    "playwright>=1.48.0",
]
local-whisper = [
    "faster-whisper>=1.1.0",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[project.scripts]
wire = "agent_wire.cli:app"
agent-wire = "agent_wire.cli:app"

[project.urls]
Homepage = "https://github.com/uncoalesced/agent-wire"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_wire"]

[tool.hatch.build.targets.wheel.force-include]
"skills/agent-wire/SKILL.md" = "agent_wire/assets/SKILL.md"
"agents/wire-worker.md" = "agent_wire/assets/wire-worker.md"
"manifests/cursor_rule.mdc" = "agent_wire/assets/cursor_rule.mdc"
"manifests/windsurf_rules.md" = "agent_wire/assets/windsurf_rules.md"
"manifests/hermes_skill.md" = "agent_wire/assets/hermes_skill.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
