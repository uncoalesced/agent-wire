[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-wire"
version = "0.1.0"
description = "High-speed, privacy-first, token-compressed live web and multi-platform intelligence engine for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "cryptography>=50.0.2",
    "curl-cffi>=0.16.3",
    "fastmcp>=4.1.0",
    "orjson>=3.13.0",
    "pydantic>=2.14.1",
    "rookiepy>=0.5.6 ; python_full_version < '3.14'",
    "selectolax>=1.0.0",
    "tiktoken>=0.14.0",
    "trafilatura>=2.3.1",
    "typer>=0.27.3",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_wire"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
