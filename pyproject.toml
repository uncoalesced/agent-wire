[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-wire"
version = "0.1.0"
description = "High-speed, privacy-first, token-compressed live web and multi-platform intelligence engine for AI agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "orjson>=3.13.0",
    "pydantic>=2.14.1",
    "selectolax>=1.0.0",
    "tiktoken>=0.14.0",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_wire"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
